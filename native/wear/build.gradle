apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

android {
    namespace 'com.unfancy.moneytracker.wear'
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId project(':app').android.defaultConfig.applicationId
        minSdk 30
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'com.unfancy.moneytracker.wear.WatchDeviceChecks'
    }

    buildFeatures { compose true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug { signingConfig project(':app').android.signingConfigs.debug }
        release { signingConfig project(':app').android.signingConfigs.findByName('release') ?: project(':app').android.signingConfigs.debug }
    }
}

dependencies {
    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.activity:activity-compose:1.9.1'
    // Keep transitive Fragment compatible with Activity Result permission contracts.
    implementation 'androidx.fragment:fragment:1.6.1'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.wear.compose:compose-material3:1.0.0-alpha29'
    implementation 'androidx.wear:wear:1.3.0'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
