services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    command:
      - postgres
      - -c
      - log_statement=none
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_min_messages=fatal
      - -c
      - log_error_verbosity=terse
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - log_disconnections=off
    environment:
      POSTGRES_DB: unfancy
      POSTGRES_USER: unfancy_migrations
      POSTGRES_PASSWORD: local-development-only
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - unfancy-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U unfancy_migrations -d unfancy"]
      interval: 2s
      timeout: 2s
      retries: 30
  flyway:
    image: redgate/flyway:13.9.0
    platform: linux/amd64
    profiles: ["migrations"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/unfancy
      FLYWAY_USER: unfancy_migrations
      FLYWAY_PASSWORD: local-development-only
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
      FLYWAY_IGNORE_MIGRATION_PATTERNS: "*:pending"
      FLYWAY_CLEAN_DISABLED: "true"
      FLYWAY_BASELINE_ON_MIGRATE: "false"
      FLYWAY_VALIDATE_ON_MIGRATE: "true"
    volumes:
      - ./db/migrations:/flyway/sql:ro
    command: migrate
volumes:
  unfancy-postgres-data:
