services:
  dynamodb:
    image: amazon/dynamodb-local:latest
    container_name: unfancy-money-tracker-dynamodb
    restart: unless-stopped
    user: root
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath /home/dynamodblocal/data"
    working_dir: /home/dynamodblocal
    ports:
      - "${DYNAMODB_PORT:-8000}:8000"
    volumes:
      - unfancy-dynamodb-data:/home/dynamodblocal/data

  localstack:
    image: localstack/localstack:3.8
    container_name: unfancy-money-tracker-localstack
    profiles: ["localstack"]
    environment:
      SERVICES: ${LOCALSTACK_SERVICES:-cognito-idp,apigateway,lambda,secretsmanager,ses,sts}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DEBUG: ${LOCALSTACK_DEBUG:-0}
      PERSISTENCE: "1"
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - unfancy-localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  unfancy-dynamodb-data:
  unfancy-localstack-data:
