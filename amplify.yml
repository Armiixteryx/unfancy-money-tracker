version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm use 22
        - npm install --global pnpm@11.17.0
        - pnpm install --frozen-lockfile
    build:
      commands:
        - bash scripts/build-amplify-web.sh
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
      - 'assets/node_modules/.pnpm/**/*'
  cache:
    paths:
      - node_modules/.cache/**/*
      - ~/.local/share/pnpm/store/**/*

customHeaders:
  - pattern: '**/*.js'
    headers:
      - key: Cache-Control
        value: public,max-age=31536000,immutable
  - pattern: '**/*.css'
    headers:
      - key: Cache-Control
        value: public,max-age=31536000,immutable
