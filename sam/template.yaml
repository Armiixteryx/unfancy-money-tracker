AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Local-only SAM routes for Unfancy Money Tracker sync boundary

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 512
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowHeaders:
        - authorization
        - content-type
      AllowMethods:
        - GET
        - POST

Resources:
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/server/handlers/sync.handler
      Environment:
        Variables:
          APP_ENV: local
          DATABASE_URL: postgresql://unfancy_migrations:local-development-only@host.docker.internal:55432/unfancy
          COGNITO_USER_POOL_ID: us-east-1_gCLS9k4s0
          COGNITO_CLIENT_ID: 63kh2vrfpvd7h9moob0m9l2umf
      Events:
        Bootstrap:
          Type: HttpApi
          Properties:
            Path: /sync/bootstrap
            Method: post
        Push:
          Type: HttpApi
          Properties:
            Path: /sync/push
            Method: post
        Pull:
          Type: HttpApi
          Properties:
            Path: /sync/pull
            Method: post
        ResolveConflict:
          Type: HttpApi
          Properties:
            Path: /sync/conflicts/resolve
            Method: post
        SharedPush:
          Type: HttpApi
          Properties:
            Path: /sync/v2/push
            Method: post
        SharedPull:
          Type: HttpApi
          Properties:
            Path: /sync/v2/pull
            Method: post
        SharedResolveConflict:
          Type: HttpApi
          Properties:
            Path: /sync/v2/conflicts/resolve
            Method: post
    Metadata:
      BuildMethod: makefile

  TrackerRelayFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/server/handlers/trackerRelay.handler
      Environment:
        Variables:
          APP_ENV: local
          DATABASE_URL: postgresql://unfancy_migrations:local-development-only@host.docker.internal:55432/unfancy
          COGNITO_USER_POOL_ID: us-east-1_gCLS9k4s0
          COGNITO_CLIENT_ID: 63kh2vrfpvd7h9moob0m9l2umf
          PUBLIC_APP_ORIGIN: http://localhost:8081
      Events:
        List:
          Type: HttpApi
          Properties:
            Path: /trackers/list
            Method: post
        Create:
          Type: HttpApi
          Properties:
            Path: /trackers/create
            Method: post
        Rename:
          Type: HttpApi
          Properties:
            Path: /trackers/rename
            Method: post
        Archive:
          Type: HttpApi
          Properties:
            Path: /trackers/archive
            Method: post
        Restore:
          Type: HttpApi
          Properties:
            Path: /trackers/restore
            Method: post
        Leave:
          Type: HttpApi
          Properties:
            Path: /trackers/leave
            Method: post
        Members:
          Type: HttpApi
          Properties:
            Path: /trackers/members
            Method: post
        Role:
          Type: HttpApi
          Properties:
            Path: /trackers/role
            Method: post
        Remove:
          Type: HttpApi
          Properties:
            Path: /trackers/remove
            Method: post
        Invite:
          Type: HttpApi
          Properties:
            Path: /trackers/invite
            Method: post
        RevokeInvitation:
          Type: HttpApi
          Properties:
            Path: /trackers/revoke-invitation
            Method: post
        PreviewInvitation:
          Type: HttpApi
          Properties:
            Path: /trackers/preview-invitation
            Method: post
        AcceptInvitation:
          Type: HttpApi
          Properties:
            Path: /trackers/accept-invitation
            Method: post
    Metadata:
      BuildMethod: makefile

  ExchangeRateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/server/handlers/exchangeRates.handler
      Environment:
        Variables:
          APP_ENV: local
          DATABASE_URL: postgresql://unfancy_migrations:local-development-only@host.docker.internal:55432/unfancy
      Events:
        Rates:
          Type: HttpApi
          Properties:
            Path: /rates
            Method: get
    Metadata:
      BuildMethod: makefile

  VoiceExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: src/server/handlers/voiceExpense.handler
      Timeout: 29
      Environment:
        Variables:
          APP_ENV: local
          DATABASE_URL: postgresql://unfancy_migrations:local-development-only@host.docker.internal:55432/unfancy
          COGNITO_USER_POOL_ID: us-east-1_gCLS9k4s0
          COGNITO_CLIENT_ID: 63kh2vrfpvd7h9moob0m9l2umf
          AI_GATEWAY_API_KEY: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          CLOUDFLARE_AUTH_TOKEN: ''
          VOICE_CATEGORY_CONFIDENCE: '0.70'
          VOICE_CURRENCY_CONFIDENCE: '0.80'
      Events:
        Expense:
          Type: HttpApi
          Properties:
            Path: /voice/expense
            Method: post
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
    Metadata:
      BuildMethod: makefile
