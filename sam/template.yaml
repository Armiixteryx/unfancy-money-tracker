AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Local-only SAM routes for Unfancy Money Tracker sync boundary

Globals:
  Function:
    Runtime: nodejs24.x
    Timeout: 30
    MemorySize: 512
  HttpApi:
    CorsConfiguration:
      AllowOrigins:
        - "*"
      AllowHeaders:
        - authorization
        - content-type
      AllowMethods:
        - GET
        - POST

Resources:
  SyncFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src/server/handlers/sync.handler
      Environment:
        Variables:
          APP_ENV: local
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
          SYNC_TABLE_NAME: unfancy-local-sync
      Events:
        Push:
          Type: HttpApi
          Properties:
            Path: /sync/push
            Method: post
        Pull:
          Type: HttpApi
          Properties:
            Path: /sync/pull
            Method: post
        ResolveConflict:
          Type: HttpApi
          Properties:
            Path: /sync/conflicts/resolve
            Method: post
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/server/handlers/sync.ts

  RateCacheTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: unfancy-local-rates
      BillingMode: PAY_PER_REQUEST
      TableClass: STANDARD
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH

  ExchangeRateFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src/server/handlers/exchangeRates.handler
      Environment:
        Variables:
          APP_ENV: local
          DYNAMODB_ENDPOINT: http://host.docker.internal:8000
          RATE_CACHE_TABLE_NAME: unfancy-local-rates
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
              Resource: !GetAtt RateCacheTable.Arn
      Events:
        Rates:
          Type: HttpApi
          Properties:
            Path: /rates
            Method: get
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/server/handlers/exchangeRates.ts

  VoiceExpenseFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ..
      Handler: src/server/handlers/voiceExpense.handler
      Timeout: 29
      Environment:
        Variables:
          APP_ENV: local
          COGNITO_USER_POOL_ID: us-east-1_gCLS9k4s0
          COGNITO_CLIENT_ID: 63kh2vrfpvd7h9moob0m9l2umf
          AI_GATEWAY_API_KEY: ''
          CLOUDFLARE_ACCOUNT_ID: ''
          CLOUDFLARE_AUTH_TOKEN: ''
          VOICE_CATEGORY_CONFIDENCE: '0.70'
          VOICE_CURRENCY_CONFIDENCE: '0.80'
      Events:
        Expense:
          Type: HttpApi
          Properties:
            Path: /voice/expense
            Method: post
            RouteSettings:
              ThrottlingRateLimit: 0.25
              ThrottlingBurstLimit: 2
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: es2022
        Sourcemap: true
        EntryPoints:
          - src/server/handlers/voiceExpense.ts
